version: '3.8'

# FinalStock Docker Compose 配置
# 包含两个服务：MariaDB 数据库 + Node.js 后端
# 启动命令：docker compose up -d
# 首次启动会自动执行 database/init.sql 初始化表结构

services:
  # MariaDB 数据库
  mariadb:
    image: mariadb:10.5
    container_name: finalstock-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-openclaw}
      MYSQL_USER: ${DB_USER:-openclaw}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ocoper}
    volumes:
      - mariadb_data:/var/lib/mysql                              # 数据持久化
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql # 首次启动自动建表
    ports:
      - "3306:3306"
    networks:
      - finalstock-network
    healthcheck:
      # 等待 InnoDB 完全初始化后再启动后端，避免连接失败
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 后端服务（依赖数据库健康检查通过后才启动）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finalstock-backend
    restart: always
    environment:
      - NODE_ENV=production
      - DB_HOST=mariadb          # 容器内通过服务名访问数据库
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-openclaw}
      - DB_USER=${DB_USER:-openclaw}
      - DB_PASSWORD=${DB_PASSWORD:-ocoper}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-siliconflow}
      - LLM_API_URL=${LLM_API_URL:-https://api.siliconflow.cn/v1/chat/completions}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      mariadb:
        condition: service_healthy  # 等待数据库就绪
    ports:
      - "3000:3000"
    networks:
      - finalstock-network

volumes:
  mariadb_data:   # 数据库数据卷，容器重建后数据不丢失

networks:
  finalstock-network:
    driver: bridge
