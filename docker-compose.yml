version: '3.8'

services:
  # MariaDB 数据库
  mariadb:
    image: mariadb:10.5
    container_name: finalstock-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-openclaw}
      MYSQL_USER: ${DB_USER:-openclaw}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ocoper}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - finalstock-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finalstock-backend
    restart: always
    environment:
      - NODE_ENV=production
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-openclaw}
      - DB_USER=${DB_USER:-openclaw}
      - DB_PASSWORD=${DB_PASSWORD:-ocoper}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-siliconflow}
      - LLM_API_URL=${LLM_API_URL:-https://api.siliconflow.cn/v1/chat/completions}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - finalstock-network

  # 前端 Nginx
  frontend:
    image: nginx:alpine
    container_name: finalstock-frontend
    restart: always
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - finalstock-network

volumes:
  mariadb_data:

networks:
  finalstock-network:
    driver: bridge